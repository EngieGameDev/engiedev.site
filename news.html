<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новости & Девлоги — EngieDEV Team</title>
<meta name="description" content="Лента новостей и девлогов разработки игр EngieDEV Team из Telegram и Bluesky.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root {
  --bg: #0d0c12;
  --bg-card: #15131d;
  --bg-card-hover: #1c1926;
  --bg-subtle: #110f17;
  
  --border: #262233;
  --border-hover: #4f426d;
  
  --text-main: #f3f2f7;
  --text-soft: #9891a6;
  --text-dim: #686175;
  
  --purple-main: #7c3aed;
  --purple-hover: #6d28d9;
  --purple-soft: #a78bfa;
  --purple-bg: #211936;
  
  --radius: 14px;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Nunito', system-ui, sans-serif;
  background-color: var(--bg);
  color: var(--text-main);
  line-height: 1.65;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

::-webkit-scrollbar {
  width: 8px;
}
::-webkit-scrollbar-track {
  background: var(--bg);
}
::-webkit-scrollbar-thumb {
  background: #2b263b;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #463d60;
}

::selection {
  background: var(--purple-main);
  color: #ffffff;
}

a {
  color: inherit;
  text-decoration: none;
}

h1, h2, h3, h4 {
  font-family: 'Baloo 2', sans-serif;
  line-height: 1.2;
  font-weight: 800;
  color: var(--text-main);
}

.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 24px;
  width: 100%;
}

/* ШАПКА */
.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(13, 12, 18, 0.94);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}

.nav-in {
  max-width: 1040px;
  margin: 0 auto;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 18px;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--purple-soft);
  background: var(--purple-bg);
  border: 1px solid #362954;
  padding: 6px 14px;
  border-radius: 8px;
  transition: all 0.15s ease;
}

.back-btn:hover {
  color: #ffffff;
  background: #2d2247;
  transform: translateX(-2px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  font-size: 1.15rem;
  color: #ffffff;
}

.brand-badge {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  object-fit: cover;
  border: 1px solid var(--border);
  background: var(--bg-card);
}

.lang-toggle {
  display: inline-flex;
  align-items: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 2px;
  font-family: 'Baloo 2', sans-serif;
}

.lang-toggle button {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 10px;
  border-radius: 7px;
  color: var(--text-soft);
  transition: all 0.15s ease;
  font-family: inherit;
  font-weight: 700;
  font-size: 0.82rem;
}

.lang-toggle button:hover {
  color: #ffffff;
}

.lang-toggle button.active {
  background: var(--purple-main);
  color: #ffffff;
}

/* ЗАГОЛОВОК СТРАНИЦЫ */
.page-header {
  padding: 48px 0 32px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-subtle);
}

.page-header h1 {
  font-size: clamp(2rem, 4.5vw, 3rem);
  margin-bottom: 8px;
}

.page-header p {
  color: var(--text-soft);
  font-size: 1.05rem;
  max-width: 640px;
}

/* ФИЛЬТРЫ И КАНАЛЫ */
.feed-controls {
  padding: 28px 0 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.feed-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.tab-btn {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-soft);
  padding: 8px 18px;
  border-radius: 9px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 0.92rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease;
}

.tab-btn:hover {
  color: #ffffff;
  border-color: var(--border-hover);
}

.tab-btn.active {
  background: var(--purple-main);
  color: #ffffff;
  border-color: var(--purple-main);
}

.channel-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 0.88rem;
  color: var(--text-soft);
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: 9px;
  transition: all 0.15s ease;
}

.channel-link-btn:hover {
  color: #ffffff;
  border-color: var(--border-hover);
  background: var(--bg-card-hover);
}

/* КАРТОЧКИ ПОСТОВ */
.feed-content {
  flex: 1;
  padding: 24px 0 64px;
}

.feed-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 20px;
}

.post-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 16px;
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}

.post-card:hover {
  transform: translateY(-3px);
  border-color: var(--border-hover);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}

.post-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.post-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 6px;
  font-family: 'Baloo 2', sans-serif;
}

.post-badge.telegram {
  background: #172433;
  color: #63b9f5;
  border: 1px solid #233e5c;
}

.post-badge.bluesky {
  background: #15273d;
  color: #64a6f7;
  border: 1px solid #23456e;
}

.post-date {
  font-size: 0.82rem;
  color: var(--text-dim);
  font-weight: 600;
}

.post-text {
  font-size: 0.95rem;
  color: var(--text-main);
  line-height: 1.62;
  white-space: pre-line;
  word-break: break-word;
}

.post-img {
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: #110f17;
  display: block;
}

.post-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 0.85rem;
}

.post-author {
  color: var(--text-dim);
  font-size: 0.82rem;
}

.post-link {
  color: var(--purple-soft);
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Baloo 2', sans-serif;
  transition: color 0.15s ease;
}

.post-link:hover {
  color: #ffffff;
}

/* ФУТЕР */
.footer {
  background: #09080d;
  border-top: 1px solid var(--border);
  padding: 24px;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.86rem;
  margin-top: auto;
}

@media (max-width: 640px) {
  .feed-controls {
    flex-direction: column;
    align-items: stretch;
  }
  .feed-tabs {
    flex-direction: column;
  }
  .tab-btn {
    justify-content: center;
  }
  .channel-link-btn {
    justify-content: center;
  }
}
</style>
</head>
<body>

<!-- НАВИГАЦИЯ -->
<nav class="nav">
  <div class="nav-in">
    <div class="nav-left">
      <a href="index.html" class="back-btn" data-i18n="nav.back">← На главную</a>
      <a href="index.html" class="brand">
        <img src="images/logo.png" class="brand-badge" alt="Logo">
        <span>EngieDEV Team</span>
      </a>
    </div>
    <div class="lang-toggle">
      <button data-lang="ru" class="active">RU</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</nav>

<!-- ЗАГОЛОВОК -->
<header class="page-header">
  <div class="wrap">
    <h1 data-i18n="news.h1">Лента новостей & Девлоги</h1>
    <p data-i18n="news.lead">Все анонсы, концепты и закулисье разработки независимых игр напрямую из наших каналов в Telegram и Bluesky.</p>
  </div>
</header>

<!-- КОНТРОЛЫ И ФИД -->
<main class="feed-content">
  <div class="wrap">
    <div class="feed-controls">
      <div class="feed-tabs">
        <button class="tab-btn active" data-source="auto" id="tabAuto">
          <i class="fa-solid fa-layer-group"></i> <span data-i18n="news.tab_auto">По языку сайта</span>
        </button>
        <button class="tab-btn" data-source="telegram" id="tabTg">
          <i class="fa-brands fa-telegram" style="color:#2AABEE"></i> Telegram (@gd_engie)
        </button>
        <button class="tab-btn" data-source="bluesky" id="tabBsky">
          <i class="fa-brands fa-bluesky" style="color:#1185FE"></i> Bluesky (English)
        </button>
      </div>

      <a id="channelSubscribeBtn" href="https://t.me/gd_engie" target="_blank" rel="noopener" class="channel-link-btn">
        <i class="fa-brands fa-telegram"></i> <span id="channelSubscribeText" data-i18n="news.sub_tg">Подписаться в Telegram</span>
      </a>
    </div>

    <!-- Сетка постов -->
    <div class="feed-grid" id="feedGrid">
      <!-- Наполняется скриптом -->
    </div>
  </div>
</main>

<!-- ФУТЕР -->
<footer class="footer" data-i18n="footer.copy">
  © 2026 EngieDEV Team · Независимая разработка игр с душой и своими руками
</footer>

<script>
const I18N = {
  ru: {
    'title':'Новости & Девлоги — EngieDEV Team',
    'desc':'Лента новостей и девлогов разработки игр EngieDEV Team из Telegram и Bluesky.',
    'nav.back':'← На главную',
    'news.h1':'Лента новостей & Девлоги',
    'news.lead':'Все анонсы, концепты и закулисье разработки независимых игр напрямую из наших каналов в Telegram и Bluesky.',
    'news.tab_auto':'По языку сайта',
    'news.sub_tg':'Подписаться в Telegram',
    'news.sub_bsky':'Читать в Bluesky',
    'news.open_post':'Открыть пост →',
    'news.empty':'Пока нет записей в этом канале.',
    'footer.copy':'© 2026 EngieDEV Team · Независимая разработка игр с душой и своими руками'
  },
  en: {
    'title':'News & Devlogs — EngieDEV Team',
    'desc':'Game development news and devlogs from EngieDEV Team on Telegram and Bluesky.',
    'nav.back':'← Back to Home',
    'news.h1':'News & Devlogs',
    'news.lead':'All announcements, concepts, and behind-the-scenes game dev updates directly from Telegram and Bluesky.',
    'news.tab_auto':'By site language',
    'news.sub_tg':'Subscribe on Telegram',
    'news.sub_bsky':'Follow on Bluesky',
    'news.open_post':'Open post →',
    'news.empty':'No posts found in this feed yet.',
    'footer.copy':'© 2026 EngieDEV Team · Indie game development with passion and heart'
  }
};

let currentLang = 'ru';
let activeFilter = 'auto'; // 'auto', 'telegram', 'bluesky'
let newsCache = null;

function setLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    const txt = I18N[lang][key];
    if(txt !== undefined) el.innerHTML = txt;
  });
  document.title = I18N[lang]['title'];
  document.querySelector('meta[name="description"]').setAttribute('content', I18N[lang]['desc']);
  document.querySelectorAll('.lang-toggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  localStorage.setItem('lang', lang);

  updateFeed();
}

document.querySelectorAll('.lang-toggle button').forEach(b=>{
  b.addEventListener('click', ()=> setLang(b.dataset.lang));
});

function formatPostDate(isoDate, lang) {
  if (!isoDate) return '';
  try {
    const d = new Date(isoDate);
    if (isNaN(d.getTime())) return '';
    const now = new Date();
    const diffHours = Math.round((now - d) / (1000 * 60 * 60));
    if (diffHours < 24 && diffHours >= 0) {
      if (diffHours <= 1) return lang === 'ru' ? 'только что' : 'just now';
      return lang === 'ru' ? `${diffHours} ч. назад` : `${diffHours}h ago`;
    }
    return d.toLocaleDateString(lang === 'ru' ? 'ru-RU' : 'en-US', { day: 'numeric', month: 'short' });
  } catch (e) {
    return '';
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function renderCards(posts) {
  const container = document.getElementById('feedGrid');
  if (!container) return;

  if (!posts || posts.length === 0) {
    container.innerHTML = `
      <div style="grid-column: 1 / -1; text-align: center; padding: 48px 16px; color: var(--text-soft); background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border);">
        <p>${I18N[currentLang]['news.empty']}</p>
      </div>`;
    return;
  }

  container.innerHTML = posts.map(post => {
    const isTg = post.source === 'telegram';
    const tagClass = isTg ? 'telegram' : 'bluesky';
    const tagIcon = isTg ? '<i class="fa-brands fa-telegram"></i>' : '<i class="fa-brands fa-bluesky"></i>';
    const tagLabel = isTg ? 'Telegram' : 'Bluesky';
    const dateFormatted = formatPostDate(post.date, currentLang);
    const readText = I18N[currentLang]['news.open_post'];
    const safeText = escapeHtml(post.text || '');
    const imageHtml = post.image ? `<img src="${post.image}" class="post-img" alt="Post attachment" loading="lazy">` : '';

    return `
      <article class="post-card">
        <div class="post-header">
          <span class="post-badge ${tagClass}">
            ${tagIcon} ${tagLabel}
          </span>
          <span class="post-date">${dateFormatted}</span>
        </div>
        <div class="post-text">${safeText}</div>
        ${imageHtml}
        <div class="post-footer">
          <span class="post-author">${escapeHtml(post.channel || '')}</span>
          <a href="${post.url}" target="_blank" rel="noopener" class="post-link">
            ${readText}
          </a>
        </div>
      </article>
    `;
  }).join('');
}

function updateFeed() {
  if (!newsCache) return;

  let targetSource = activeFilter;
  if (activeFilter === 'auto') {
    targetSource = (currentLang === 'ru') ? 'telegram' : 'bluesky';
  }

  // Обновляем состояние табов
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const s = btn.dataset.source;
    btn.classList.toggle('active', s === activeFilter || (activeFilter === 'auto' && s === targetSource));
  });

  // Обновляем кнопку подписки
  const subBtn = document.getElementById('channelSubscribeBtn');
  const subText = document.getElementById('channelSubscribeText');
  if (targetSource === 'telegram') {
    subBtn.href = 'https://t.me/gd_engie';
    subBtn.querySelector('i').className = 'fa-brands fa-telegram';
    subBtn.querySelector('i').style.color = '#2AABEE';
    subText.textContent = I18N[currentLang]['news.sub_tg'];
    renderCards(newsCache.ru || []);
  } else {
    subBtn.href = 'https://bsky.app/profile/engiedev.bsky.social';
    subBtn.querySelector('i').className = 'fa-brands fa-bluesky';
    subBtn.querySelector('i').style.color = '#1185FE';
    subText.textContent = I18N[currentLang]['news.sub_bsky'];
    renderCards(newsCache.en || []);
  }
}

async function loadFeed() {
  try {
    const res = await fetch('data/news.json');
    if (!res.ok) throw new Error('news.json not found');
    newsCache = await res.json();
    updateFeed();
  } catch (err) {
    console.warn('Загрузка fallback новостей:', err);
    newsCache = {
      ru: [
        {
          id: 'tg_562',
          source: 'telegram',
          channel: '@gd_engie',
          url: 'https://t.me/gd_engie/562',
          date: '2026-09-15T14:32:32+00:00',
          text: 'Сегодня вышел девлог от Orsoniks (разработчик Cas:U), и тот решил постримить как он играет на своем сервере, где 50к+ пользователей... 100 человек находилось в Голосовом чате, в том числе и я.'
        },
        {
          id: 'tg_561',
          source: 'telegram',
          channel: '@gd_engie',
          url: 'https://t.me/gd_engie/561',
          date: '2026-09-14T10:47:54+00:00',
          text: 'В BlueSky умер мой самый любимый бот, помогающий мне с продвижением. Земля ему пухом 🫡'
        },
        {
          id: 'tg_560',
          source: 'telegram',
          channel: '@gd_engie',
          url: 'https://t.me/gd_engie/560',
          date: '2026-09-14T10:18:49+00:00',
          text: 'Чтож, эээ, новая неделя, новая попытка подружиться с Тик-ток. Я в очередной раз создал новый аккаунт...'
        }
      ],
      en: [
        {
          id: 'bsky_3mvhvqfexac2t',
          source: 'bluesky',
          channel: '@engiedev.bsky.social',
          url: 'https://bsky.app/profile/engiedev.bsky.social/post/3mvhvqfexac2t',
          date: '2026-09-14T10:30:36.105Z',
          text: "Hey guys! I'm not dead, I'm doing aggressive strategy for PR my game, and it still not working... But we keep developing and pushing forward! 🎮"
        },
        {
          id: 'bsky_3muud4366ns2f',
          source: 'bluesky',
          channel: '@engiedev.bsky.social',
          url: 'https://bsky.app/profile/engiedev.bsky.social/post/3muud4366ns2f',
          date: '2026-09-06T15:36:31.932Z',
          text: 'We made announcement trailer, take a look and add to your wishlist! Lost Windshard is entering new development milestones.'
        }
      ]
    };
    updateFeed();
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.source;
    updateFeed();
  });
});

loadFeed();
setLang(localStorage.getItem('lang') || 'ru');
</script>
</body>
</html>
