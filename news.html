<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новости & Девлоги — EngieDEV Team</title>
<meta name="description" content="Лента новостей и девлогов разработки игр EngieDEV Team из Telegram и Bluesky.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root {
  --bg: #0d0c12;
  --bg-card: #15131d;
  --bg-card-hover: #1c1926;
  --bg-subtle: #110f17;
  
  --border: #262233;
  --border-hover: #4f426d;
  
  --text-main: #f3f2f7;
  --text-soft: #9891a6;
  --text-dim: #686175;
  
  --purple-main: #7c3aed;
  --purple-hover: #6d28d9;
  --purple-soft: #a78bfa;
  --purple-bg: #211936;
  
  --radius: 14px;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Nunito', system-ui, sans-serif;
  background-color: var(--bg);
  color: var(--text-main);
  line-height: 1.65;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

::-webkit-scrollbar {
  width: 8px;
}
::-webkit-scrollbar-track {
  background: var(--bg);
}
::-webkit-scrollbar-thumb {
  background: #2b263b;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #463d60;
}

::selection {
  background: var(--purple-main);
  color: #ffffff;
}

a {
  color: inherit;
  text-decoration: none;
}

h1, h2, h3, h4 {
  font-family: 'Baloo 2', sans-serif;
  line-height: 1.2;
  font-weight: 800;
  color: var(--text-main);
}

.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 24px;
  width: 100%;
}

/* ШАПКА */
.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(13, 12, 18, 0.94);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}

.nav-in {
  max-width: 1040px;
  margin: 0 auto;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 18px;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--purple-soft);
  background: var(--purple-bg);
  border: 1px solid #362954;
  padding: 6px 14px;
  border-radius: 8px;
  transition: all 0.15s ease;
}

.back-btn:hover {
  color: #ffffff;
  background: #2d2247;
  transform: translateX(-2px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  font-size: 1.15rem;
  color: #ffffff;
}

.brand-badge {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  object-fit: cover;
  border: 1px solid var(--border);
  background: var(--bg-card);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.refresh-btn {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-soft);
  padding: 6px 12px;
  border-radius: 8px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}

.refresh-btn:hover {
  color: #ffffff;
  border-color: var(--border-hover);
}

.refresh-btn i.spinning {
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.lang-toggle {
  display: inline-flex;
  align-items: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 2px;
  font-family: 'Baloo 2', sans-serif;
}

.lang-toggle button {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 10px;
  border-radius: 7px;
  color: var(--text-soft);
  transition: all 0.15s ease;
  font-family: inherit;
  font-weight: 700;
  font-size: 0.82rem;
}

.lang-toggle button:hover {
  color: #ffffff;
}

.lang-toggle button.active {
  background: var(--purple-main);
  color: #ffffff;
}

/* ЗАГОЛОВОК СТРАНИЦЫ */
.page-header {
  padding: 48px 0 32px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-subtle);
}

.page-header h1 {
  font-size: clamp(2rem, 4.5vw, 3rem);
  margin-bottom: 8px;
}

.page-header p {
  color: var(--text-soft);
  font-size: 1.05rem;
  max-width: 640px;
}

/* ФИЛЬТРЫ И КАНАЛЫ */
.feed-controls {
  padding: 28px 0 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.feed-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.tab-btn {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-soft);
  padding: 8px 18px;
  border-radius: 9px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 0.92rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease;
}

.tab-btn:hover {
  color: #ffffff;
  border-color: var(--border-hover);
}

.tab-btn.active {
  background: var(--purple-main);
  color: #ffffff;
  border-color: var(--purple-main);
}

.channel-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 0.88rem;
  color: var(--text-soft);
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: 9px;
  transition: all 0.15s ease;
}

.channel-link-btn:hover {
  color: #ffffff;
  border-color: var(--border-hover);
  background: var(--bg-card-hover);
}

/* КАРТОЧКИ ПОСТОВ */
.feed-content {
  flex: 1;
  padding: 24px 0 64px;
}

.feed-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 22px;
}

.post-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 16px;
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}

.post-card:hover {
  transform: translateY(-3px);
  border-color: var(--border-hover);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}

.post-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.post-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 6px;
  font-family: 'Baloo 2', sans-serif;
}

.post-badge.telegram {
  background: #172433;
  color: #63b9f5;
  border: 1px solid #233e5c;
}

.post-badge.bluesky {
  background: #15273d;
  color: #64a6f7;
  border: 1px solid #23456e;
}

.post-date {
  font-size: 0.82rem;
  color: var(--text-dim);
  font-weight: 600;
}

.post-text {
  font-size: 0.95rem;
  color: var(--text-main);
  line-height: 1.62;
  white-space: pre-line;
  word-break: break-word;
}

/* МЕДИА: GIF, ВИДЕО И КАРТИНКИ */
.post-media-wrap {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: #110f17;
  display: block;
  margin-top: 6px;
  cursor: pointer;
  transition: border-color 0.15s ease;
}

.post-media-wrap:hover {
  border-color: var(--purple-soft);
}

.post-media-img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  background: #110f17;
}

.post-media-wrap.is-gif video {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  background: #110f17;
}

.post-play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(13, 12, 18, 0.85);
  backdrop-filter: blur(4px);
  border: 1.5px solid var(--purple-soft);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  padding-left: 3px;
  transition: all 0.2s ease;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
}

.post-media-wrap:hover .post-play-btn {
  background: var(--purple-main);
  border-color: var(--purple-main);
  transform: translate(-50%, -50%) scale(1.1);
}

.post-media-badge {
  position: absolute;
  bottom: 8px;
  right: 8px;
  background: rgba(13, 12, 18, 0.85);
  backdrop-filter: blur(4px);
  color: #ffffff;
  font-size: 0.73rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'Baloo 2', sans-serif;
}

.post-media-badge.badge-gif {
  background: rgba(124, 58, 237, 0.88);
  border-color: #a78bfa;
}

.post-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 0.85rem;
}

.post-author {
  color: var(--text-dim);
  font-size: 0.82rem;
}

.post-link {
  color: var(--purple-soft);
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Baloo 2', sans-serif;
  transition: color 0.15s ease;
}

.post-link:hover {
  color: #ffffff;
}

/* ФУТЕР */
.footer {
  background: #09080d;
  border-top: 1px solid var(--border);
  padding: 24px;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.86rem;
  margin-top: auto;
}

@media (max-width: 640px) {
  .feed-controls {
    flex-direction: column;
    align-items: stretch;
  }
  .feed-tabs {
    flex-direction: column;
  }
  .tab-btn {
    justify-content: center;
  }
  .channel-link-btn {
    justify-content: center;
  }
}

/* ПЛАВАЮЩАЯ КНОПКА СВЯЗИ (FAB) */
.contact-fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 900;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  background: var(--bg-card);
  color: var(--text-main);
  border: 1px solid var(--border-hover);
  border-radius: 9999px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}
.contact-fab i {
  color: var(--purple-soft);
  font-size: 1.05rem;
}
.contact-fab:hover {
  background: var(--bg-card-hover);
  border-color: var(--purple-main);
  transform: translateY(-2px);
  box-shadow: 0 14px 28px rgba(124, 58, 237, 0.22);
}
.contact-fab:active {
  transform: translateY(0);
}

/* МОДАЛЬНЫЙ ОВЕРЛЕЙ И ФОРМА */
.contact-overlay {
  position: fixed;
  inset: 0;
  background: rgba(7, 6, 11, 0.78);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.22s ease, visibility 0.22s ease;
}
.contact-overlay.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.contact-modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 26px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
  transform: translateY(16px) scale(0.98);
  transition: transform 0.22s ease;
}
.contact-overlay.active .contact-modal {
  transform: translateY(0) scale(1);
}
.contact-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.contact-title {
  font-family: 'Baloo 2', sans-serif;
  font-size: 1.35rem;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
}
.contact-title i {
  color: var(--purple-soft);
}
.contact-close-btn {
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 1.7rem;
  line-height: 1;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  transition: color 0.15s ease, background 0.15s ease;
}
.contact-close-btn:hover {
  color: #fff;
  background: var(--bg-subtle);
}
.contact-group {
  margin-bottom: 15px;
  text-align: left;
}
.contact-label {
  display: block;
  font-size: 0.86rem;
  font-weight: 600;
  color: var(--text-soft);
  margin-bottom: 6px;
}
.contact-input, .contact-select, .contact-textarea {
  width: 100%;
  padding: 11px 14px;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-main);
  font-family: inherit;
  font-size: 0.94rem;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  outline: none;
  box-sizing: border-box;
}
.contact-input:focus, .contact-select:focus, .contact-textarea:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
}
.contact-select option {
  background: var(--bg-card);
  color: var(--text-main);
}
.contact-textarea {
  resize: vertical;
  min-height: 95px;
}
.contact-submit {
  width: 100%;
  padding: 13px 20px;
  background: var(--purple-main);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-size: 0.98rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: background 0.2s ease, transform 0.15s ease;
  margin-top: 18px;
}
.contact-submit:hover {
  background: var(--purple-hover);
}
.contact-submit:disabled {
  opacity: 0.65;
  cursor: not-allowed;
}
.contact-status {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 0.9rem;
  line-height: 1.5;
  display: none;
}
.contact-status.success {
  display: block;
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(16, 185, 129, 0.3);
  color: #6ee7b7;
}
.contact-status.error {
  display: block;
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #fca5a5;
}
.contact-status.info {
  display: block;
  background: rgba(124, 58, 237, 0.12);
  border: 1px solid rgba(124, 58, 237, 0.3);
  color: #c4b5fd;
}
.contact-note {
  margin-top: 10px;
  font-size: 0.78rem;
  color: var(--text-dim);
  text-align: center;
}

@media (max-width: 540px) {
  .contact-fab {
    bottom: 18px;
    right: 18px;
    padding: 12px 14px;
  }
  .contact-fab-text {
    display: none;
  }
  .contact-fab i {
    font-size: 1.15rem;
  }
  .contact-modal {
    padding: 20px;
  }
}
</style>
</head>
<body>

<!-- НАВИГАЦИЯ -->
<nav class="nav">
  <div class="nav-in">
    <div class="nav-left">
      <a href="index.html" class="back-btn" data-i18n="nav.back">← На главную</a>
      <a href="index.html" class="brand">
        <img src="images/logo.png" class="brand-badge" alt="Logo">
        <span>EngieDEV Team</span>
      </a>
    </div>
    <div class="nav-right">
      <button class="refresh-btn" id="refreshFeedBtn" title="Обновить ленту">
        <i class="fa-solid fa-rotate-right" id="refreshIcon"></i> <span data-i18n="news.refresh">Обновить</span>
      </button>
      <div class="lang-toggle">
        <button data-lang="ru" class="active">RU</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </div>
</nav>

<!-- ЗАГОЛОВОК -->
<header class="page-header">
  <div class="wrap">
    <h1 data-i18n="news.h1">Лента новостей & Девлоги</h1>
    <p data-i18n="news.lead">Все анонсы, концепты и закулисье разработки независимых игр напрямую из наших каналов в Telegram и Bluesky.</p>
  </div>
</header>

<!-- КОНТРОЛЫ И ФИД -->
<main class="feed-content">
  <div class="wrap">
    <div class="feed-controls">
      <div class="feed-tabs">
        <button class="tab-btn active" data-source="auto" id="tabAuto">
          <i class="fa-solid fa-layer-group"></i> <span data-i18n="news.tab_auto">По языку сайта</span>
        </button>
        <button class="tab-btn" data-source="telegram" id="tabTg">
          <i class="fa-brands fa-telegram" style="color:#2AABEE"></i> Telegram (@gd_engie)
        </button>
        <button class="tab-btn" data-source="bluesky" id="tabBsky">
          <i class="fa-brands fa-bluesky" style="color:#1185FE"></i> Bluesky (English)
        </button>
      </div>

      <a id="channelSubscribeBtn" href="https://t.me/gd_engie" target="_blank" rel="noopener" class="channel-link-btn">
        <i class="fa-brands fa-telegram"></i> <span id="channelSubscribeText" data-i18n="news.sub_tg">Подписаться в Telegram</span>
      </a>
    </div>

    <!-- Сетка постов -->
    <div class="feed-grid" id="feedGrid">
      <!-- Наполняется скриптом -->
    </div>
  </div>
</main>

<!-- ФУТЕР -->
<footer class="footer" data-i18n="footer.copy">
  Соло-разработчик
</footer>

<!-- ПЛАВАЮЩАЯ КНОПКА СВЯЗИ (FAB) -->
<button class="contact-fab" id="openContactFab" type="button" aria-label="Связаться с нами">
  <i class="fa-solid fa-envelope"></i>
  <span class="contact-fab-text" data-i18n="contact.fab">Связаться</span>
</button>

<!-- МОДАЛЬНОЕ ОКНО ПИСЬМА -->
<div class="contact-overlay" id="contactOverlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="contact-modal">
    <div class="contact-header">
      <div class="contact-title">
        <i class="fa-solid fa-envelope-open-text"></i>
        <span data-i18n="contact.title">Написать нам</span>
      </div>
      <button class="contact-close-btn" id="closeContactBtn" type="button" aria-label="Закрыть">&times;</button>
    </div>
    
    <form id="contactForm" novalidate>
	  <input type="hidden" name="access_key" id="contactAccessKey" value="4676d294-1c47-4df8-bd14-3093988d8fb7">
      <input type="checkbox" name="botcheck" style="display:none">
      
      <div class="contact-group">
        <label class="contact-label" for="contactName" data-i18n="contact.name">Ваше имя</label>
        <input type="text" id="contactName" name="name" class="contact-input" placeholder="Иван / Alex" data-i18n-placeholder="contact.p_name" required>
      </div>

function setLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    const txt = I18N[lang][key];
    if(txt !== undefined) el.innerHTML = txt;
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const key = el.dataset.i18nPlaceholder;
    const txt = I18N[lang][key];
    if(txt !== undefined) el.setAttribute('placeholder', txt);
  });
  document.title = I18N[lang]['title'];
  document.querySelector('meta[name="description"]').setAttribute('content', I18N[lang]['desc']);
  document.querySelectorAll('.lang-toggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  localStorage.setItem('lang', lang);

  updateFeed();
}

function formatPostDate(isoDate, lang) {
  if (!isoDate) return '';
  try {
    const d = new Date(isoDate);
    if (isNaN(d.getTime())) return '';
    const now = new Date();
    const diffHours = Math.round((now - d) / (1000 * 60 * 60));
    if (diffHours < 24 && diffHours >= 0) {
      if (diffHours <= 1) return lang === 'ru' ? 'только что' : 'just now';
      return lang === 'ru' ? `${diffHours} ч. назад` : `${diffHours}h ago`;
    }
    return d.toLocaleDateString(lang === 'ru' ? 'ru-RU' : 'en-US', { day: 'numeric', month: 'short' });
  } catch (e) {
    return '';
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function renderCards(posts) {
  const container = document.getElementById('feedGrid');
  if (!container) return;

  if (!posts || posts.length === 0) {
    container.innerHTML = `
      <div style="grid-column: 1 / -1; text-align: center; padding: 48px 16px; color: var(--text-soft); background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border);">

    return;
  }

  container.innerHTML = posts.map(post => {
    const isTg = post.source === 'telegram';
    const tagClass = isTg ? 'telegram' : 'bluesky';
    const tagIcon = isTg ? '<i class="fa-brands fa-telegram"></i>' : '<i class="fa-brands fa-bluesky"></i>';
    const tagLabel = isTg ? 'Telegram' : 'Bluesky';
    const dateFormatted = formatPostDate(post.date, currentLang);
    const readText = I18N[currentLang]['news.open_post'];
    const safeText = escapeHtml(post.text || '');

    // Отрисовка медиа (GIF, видео, ссылка или картинка)
    let mediaHtml = '';
    const isGif = post.media_type === 'gif';
    const isVideo = post.media_type === 'video';
    const isLink = post.media_type === 'link';

    if (isGif) {
      mediaHtml = `
        <a href="${post.url}" target="_blank" rel="noopener" class="post-media-wrap is-gif" title="${readText}">
          ${post.video_src ? `
            <video src="${post.video_src}" poster="${post.image || ''}" autoplay muted loop playsinline class="post-media-img"></video>
          ` : `
            <img src="${post.image}" class="post-media-img" alt="GIF preview" loading="lazy">
          `}
          <span class="post-media-badge badge-gif"><i class="fa-solid fa-bolt"></i> ${I18N[currentLang]['news.gif_badge']}</span>
        </a>
      `;
    } else if (isVideo && post.image) {
      mediaHtml = `
        <a href="${post.url}" target="_blank" rel="noopener" class="post-media-wrap is-video" title="${readText}">
          <img src="${post.image}" class="post-media-img" alt="Video preview" loading="lazy">
          <div class="post-play-btn"><i class="fa-solid fa-play"></i></div>
          <span class="post-media-badge"><i class="fa-solid fa-play"></i> ${I18N[currentLang]['news.video_badge']}</span>
        </a>
      `;
    } else if (isLink && post.image) {
      mediaHtml = `
        <a href="${post.url}" target="_blank" rel="noopener" class="post-media-wrap is-link" title="${readText}">
          <img src="${post.image}" class="post-media-img" alt="Link preview" loading="lazy">
          <span class="post-media-badge"><i class="fa-solid fa-arrow-up-right-from-square"></i> ${I18N[currentLang]['news.link_badge']}</span>
        </a>
      `;
    } else if (post.image) {
      mediaHtml = `
        <a href="${post.url}" target="_blank" rel="noopener" class="post-media-wrap is-image" title="${readText}">
          <img src="${post.image}" class="post-media-img" alt="Attached photo" loading="lazy">
        </a>
      `;
    }

    return `
      <article class="post-card">
        <div class="post-header">
          <span class="post-badge ${tagClass}">
            ${tagIcon} ${tagLabel}

}

  }
}

// Прямой запрос в публичное API Bluesky для моментального обновления без задержки
async function fetchLiveBluesky() {
  try {
    const res = await fetch('https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=engiedev.bsky.social&limit=15');
    if (!res.ok) return null;
    const data = await res.json();
    const posts = [];
    for (const item of (data.feed || [])) {
      const post = item.post;
      const rec = post && post.record;
      if (!rec || rec.reply) continue;
      const uri = post.uri || '';
      const rkey = uri.split('/').pop();
      
      let mediaType = null;
      let mediaUrl = null;
      const embed = post.embed || {};
      
      if (embed.images && embed.images[0]) {
        mediaType = 'image';
        mediaUrl = embed.images[0].thumb || embed.images[0].fullsize;
      } else if (embed.thumbnail) {
        mediaType = 'video';
        mediaUrl = embed.thumbnail;
      } else if (embed.external && embed.external.thumb) {
        const extUri = (embed.external.uri || '').toLowerCase();
        mediaType = (extUri.includes('youtu') || extUri.includes('vimeo')) ? 'video' : 'link';
        mediaUrl = embed.external.thumb;
      }

      let text = rec.text || '';
      if (!text) {
        if (mediaType === 'video') text = 'New game dev video';
        else if (mediaType === 'image') text = 'New game dev screenshot';
      }

      posts.push({
        id: 'bsky_' + rkey,
        source: 'bluesky',
        source_name: 'Bluesky',
        channel: '@engiedev.bsky.social',
        url: `https://bsky.app/profile/engiedev.bsky.social/post/${rkey}`,
        date: rec.createdAt,
        text: text,
        image: mediaUrl,
        video_src: null,
        media_type: mediaType
      });
    }
    return posts;
  } catch (e) {
    return null;
  }
}

const contactFab = document.getElementById('openContactFab');
const contactOverlay = document.getElementById('contactOverlay');
const closeContactBtn = document.getElementById('closeContactBtn');
const contactForm = document.getElementById('contactForm');
const contactStatus = document.getElementById('contactStatus');
const contactSubmitBtn = document.getElementById('contactSubmitBtn');
const contactAccessKey = document.getElementById('contactAccessKey');

function openContactModal() {
  if (!contactOverlay) return;
  contactOverlay.classList.add('active');
  contactOverlay.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  const nameInput = document.getElementById('contactName');
  if (nameInput) setTimeout(() => nameInput.focus(), 100);
}

function closeContactModal() {
  if (!contactOverlay) return;
  contactOverlay.classList.remove('active');
  contactOverlay.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

if (contactFab) contactFab.addEventListener('click', openContactModal);
if (closeContactBtn) closeContactBtn.addEventListener('click', closeContactModal);
if (contactOverlay) {
  contactOverlay.addEventListener('click', (e) => {
    if (e.target === contactOverlay) closeContactModal();
  });
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && contactOverlay && contactOverlay.classList.contains('active')) {
    closeContactModal();
  }
});

if (contactForm) {
  contactForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const curL = currentLang || 'ru';
    
    const nameVal = document.getElementById('contactName').value.trim();
    const emailVal = document.getElementById('contactEmail').value.trim();
    const msgVal = document.getElementById('contactMessage').value.trim();
    
    if (!nameVal || !emailVal || !msgVal) {
      contactStatus.className = 'contact-status error';
      contactStatus.textContent = I18N[curL]['contact.fill_fields'];
      return;
    }

    const key = contactAccessKey ? contactAccessKey.value.trim() : '';
    
    contactSubmitBtn.disabled = true;
    const originalBtnHtml = contactSubmitBtn.innerHTML;
    contactSubmitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>${I18N[curL]['contact.sending']}</span>`;
    contactStatus.className = 'contact-status';
    contactStatus.style.display = 'none';

    if (!key || key === 'YOUR_ACCESS_KEY_HERE') {
      setTimeout(() => {
        contactSubmitBtn.disabled = false;
        contactSubmitBtn.innerHTML = originalBtnHtml;
        contactStatus.className = 'contact-status info';
        contactStatus.innerHTML = `<i class="fa-solid fa-circle-info"></i> ${I18N[curL]['contact.demo_notice']}`;
      }, 500);
      return;
    }

    try {
      const formData = new FormData(contactForm);
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        body: formData,
        headers: {
          'Accept': 'application/json'
        }
      });
      const data = await res.json();
      
      contactSubmitBtn.disabled = false;
      contactSubmitBtn.innerHTML = originalBtnHtml;
      
      if (data.success) {
        contactStatus.className = 'contact-status success';
        contactStatus.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${I18N[curL]['contact.success']}`;
        contactForm.reset();
      } else {
        contactStatus.className = 'contact-status error';
        contactStatus.textContent = data.message || I18N[curL]['contact.error'];
      }
    } catch (err) {
      contactSubmitBtn.disabled = false;
      contactSubmitBtn.innerHTML = originalBtnHtml;
      contactStatus.className = 'contact-status error';
      contactStatus.textContent = I18N[curL]['contact.error'];
    }
  });
}
